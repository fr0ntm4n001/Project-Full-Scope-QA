# Main Playwright test job
playwright_tests:
  stage: test
  image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-jammy
  tags:
    - external
  timeout: 3h

  variables:
    # Environment variables for tests
    CI: "true"
    PLAYWRIGHT_BROWSERS_PATH: ".ms-playwright"
    # Add your environment-specific variables here
    BASE_URL: "https://convoa-1.taild6271e.ts.net"

  before_script:
    - mkdir -p test-results playwright-report test-artifacts
    - echo "Setting up Playwright environment..."
    - echo ".env contents:" && cat .env
    - git config --global credential.helper store
    - echo "https://${GIT_USER}:${GIT_PASSWORD}@010.taild6271e.ts.net" > ~/.git-credentials

    # Install dependencies
    - npm ci --prefer-offline --no-audit

    # Install browsers with dependencies
    - npx playwright install --with-deps chromium firefox webkit

    # Increase file descriptor limits
    - ulimit -n 65535

  script:
    - echo "Starting Playwright tests..."
    - export CI=true
    - npx playwright test e2e/ \
      --reporter=line,junit=test-results/results.xml,html=playwright-report \
      --output=test-artifacts \
      --timeout=300000 \
      --workers=1 \
      --project=chromium \
      --trace=off \
      --video=off || true

  after_script:
    - echo "Test execution completed"

  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/results.xml
    paths:
      - playwright-report/index.html
      - test-results/results.xml
    expose_as: "Playwright Test Results"
