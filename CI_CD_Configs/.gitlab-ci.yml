# .gitlab-ci.yml - Optimized Version

# old original version is above

stages:
  - build
  - run
  - test
  - report

variables:
  IMAGE_NAME: voicebot-ui
  PLAYWRIGHT_VERSION: "1.54.1"
  NODE_VERSION: "18"

# Build Docker image (main & develop only)
build_image:
  stage: build
  tags:
    - $CI_COMMIT_REF_NAME
  script:
    - docker build -t $IMAGE_NAME .
  only:
    - main
    - develop

# Run container (main & develop only)
run_container:
  stage: run
  tags:
    - $CI_COMMIT_REF_NAME
  script:
    - docker rm -f $IMAGE_NAME || true
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "Deploying to production environment"
        docker compose -f docker-compose-prod.yml down --remove-orphans
        docker compose -f docker-compose-prod.yml up -d
      else
        echo "Deploying to staging environment"
        docker compose -f docker-compose-dev.yml down --remove-orphans
        docker compose -f docker-compose-dev.yml up -d
      fi
    - sleep 15 # Increased wait time for app to be ready
    # Health check to ensure application is running
    - |
      echo "Waiting for application to be ready..."
      timeout 120 bash -c 'until curl -f http://localhost:3000 || curl -f https://convoa-1.taild6271e.ts.net; do sleep 5; done'
  only:
    - main
    - develop

