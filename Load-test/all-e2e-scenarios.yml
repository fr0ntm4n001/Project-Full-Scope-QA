config:
  target: "https://convoa-1.taild6271e.ts.net"
  phases:
    # Warm-up phase
    - duration: 120
      arrivalRate: 3
      name: "Warm-up - All E2E Scenarios"
    # Gradual ramp-up
    - duration: 180
      arrivalRate: 8
      name: "Ramp-up"
    # Steady load phase
    - duration: 600
      arrivalRate: 12
      name: "Steady Load - All E2E Test Cases"
    # Peak load phase
    - duration: 300
      arrivalRate: 20
      name: "Peak Load"
    # Cool-down phase
    - duration: 120
      arrivalRate: 3
      name: "Cool-down"

  http:
    timeout: 90
    pool: 100
    keepAlive: true

  plugins:
    expect: {}
    metrics-by-endpoint: {}

  # Test data covering all scenarios
  variables:
    primaryTestUsers:
      - "testerdrew7@yopmail.com"
    # secondaryTestUsers:
    #   - "loadtest1@yopmail.com"
    #   - "loadtest2@yopmail.com"
    #   - "loadtest3@yopmail.com"
    testPasswords:
      - "Test12345@"
      # - "LoadTest123@"
    # companyNames:
    #   - "Acme Corp"
    #   - "Tech Solutions Inc"
    #   - "Digital Services LLC"
    #   - "Innovation Hub"
    # phoneNumbers:
    #   - "+12345678901"
    #   - "+19876543210"
    #   - "+15551234567"

scenarios:
