  # 2. Full Login and Navigation (2-Test-Sign-In.spec.js)
  - name: "Login and Navigation Flow"
    weight: 28
    flow:
      - get:
          url: "/login"
          expect:
            - statusCode: 200
          capture:
            - header: "set-cookie"
              as: "sessionCookie"

      - think: 2

      - post:
          url: "/api/v1/auth/sign-in"
          headers:
            Cookie: "{{ sessionCookie }}"
          form:
            username: "{{ primaryTestUsers }}"
            password: "{{ testPasswords }}"
          expect:
            - statusCode: [200, 400, 401]
          capture:
            - json: "$.access_token"
              as: "authToken"
            - json: "$.user.id"
              as: "userId"
              ifUndefined: "skip"

      - think: 1

      # Dashboard navigation
      - get:
          url: "/dashboard"
          headers:
            Authorization: "Bearer {{ authToken }}"
            Cookie: "{{ sessionCookie }}"
          expect:
            - statusCode: [200, 500]

      - think: 2

      # User profile and settings
      - get:
          url: "/api/v1/user/me"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]

  # 3. Dashboard Comprehensive Testing (3-Test-Dashboard.spec.js)
  - name: "Dashboard Comprehensive Flow"
    weight: 15
    flow:
      # Login
      - post:
          url: "/api/v1/auth/sign-in"
          form:
            username: "{{ primaryTestUsers }}"
            password: "{{ testPasswords }}"
          expect:
            - statusCode: [200, 400, 401]
          capture:
            - json: "$.access_token"
              as: "authToken"

      # Dashboard access
      - get:
          url: "/dashboard"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401]

      - think: 2

      # Dashboard data endpoints
      - get:
          url: "/api/v1/dashboard/call-count-by-category"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]

      - get:
          url: "/api/v1/dashboard/call-volume-by-hour"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 400, 401, 404]

      - get:
          url: "/api/v1/dashboard/call-volume-per-day"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]

      - think: 1

      # Navigate to other sections
      - get:
          url: "/conversations"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 500]

      - get:
          url: "/services"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: 200

  # 4. Conversation Management (4-Test-Conversation.spec.js)
  - name: "Conversation Management Flow"
    weight: 12
    flow:
      # Login
      - post:
          url: "/api/v1/auth/sign-in"
          form:
            username: "{{ primaryTestUsers }}"
            password: "{{ testPasswords }}"
          expect:
            - statusCode: [200, 400, 401]
          capture:
            - json: "$.access_token"
              as: "authToken"

      # Conversations page
      - get:
          url: "/conversation"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401]

      - think: 2

      # Fetch conversations data
      - get:
          url: "/api/v1/voice/calls/"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]
          capture:
            - json: "$[0].id"
              as: "conversationId"
              ifUndefined: "skip"

      # Get specific conversation
      - get:
          url: "/api/v1/voice/calls/messages/{{ conversationId }}"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]
          ifTrue: "conversationId"

      # Search and analytics (using existing endpoints)
      - get:
          url: "/api/v1/dashboard/call-count-by-category"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]

  # 5. Services and File Management (5-Test-Services.spec.js)
  - name: "Services and File Management"
    weight: 10
    flow:
      # Login
      - post:
          url: "/api/v1/auth/sign-in"
          form:
            username: "{{ primaryTestUsers }}"
            password: "{{ testPasswords }}"
          expect:
            - statusCode: [200, 400, 401]
          capture:
            - json: "$.access_token"
              as: "authToken"

      # Services page
      - get:
          url: "/services"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 500]

      - think: 3

      # Services data
      - get:
          url: "/api/v1/voice/files/"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]

      - get:
          url: "/api/v1/voice/assistants/"
          headers:
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: [200, 401, 404]

  # 6. Assistant Configuration (6-Test-Assistant.spec.js)
  - name: "Assistant Configuration Flow"
